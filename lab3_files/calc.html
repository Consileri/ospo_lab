<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Специальный калькулятор</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .calc-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            width: 300px;
        }
        .display-area {
            margin-bottom: 15px;
        }
        #result {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #fafafa;
        }
        .inputs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        input {
            width: 45%;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        input.active {
            border-color: #007bff;
        }
        select {
            width: 50px;
            padding: 8px;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #eee;
            transition: background 0.2s;
        }
        button:hover {
            background: #ddd;
        }
        .btn-calc {
            grid-column: span 3;
            background: #28a745;
            color: white;
            font-weight: bold;
        }
        .btn-calc:hover {
            background: #218838;
        }
        .btn-clear {
            grid-column: span 3;
            background: #dc3545;
            color: white;
            margin-top: 5px;
        }
        .danger {
            background-color: #ff4d4d !important;
            color: white;
        }
    </style>
</head>
<body>

<div class="calc-container">
    <div class="display-area">
        <div id="result">Ответ</div>
        <div class="inputs">
            <input type="text" id="num1" placeholder="Число 1" readonly class="active" onclick="setActive(1)">
            <select id="op">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>
            <input type="text" id="num2" placeholder="Число 2" readonly onclick="setActive(2)">
        </div>
    </div>

    <div class="keypad">
        <button onclick="addNum(1)">1</button>
        <button onclick="addNum(2)">2</button>
        <button onclick="addNum(3)">3</button>
        <button onclick="addNum(4)">4</button>
        <button onclick="addNum(5)">5</button>
        <button onclick="addNum(6)">6</button>
        <button onclick="addNum(7)">7</button>
        <button onclick="addNum(8)">8</button>
        <button onclick="addNum(9)">9</button>
        <button onclick="addNum(0)" style="grid-column: span 3;">0</button>
        <button class="btn-calc" onclick="calculate()">Посчитать</button>
        <button class="btn-clear" onclick="clearAll()">Очистить</button>
    </div>
</div>

<script>
    let activeInput = 1;

    function setActive(num) {
        activeInput = num;
        document.getElementById('num1').classList.toggle('active', num === 1);
        document.getElementById('num2').classList.toggle('active', num === 2);
    }

    function addNum(val) {
        const input = document.getElementById('num' + activeInput);
        input.value += val;
    }

    function clearAll() {
        document.getElementById('num1').value = '';
        document.getElementById('num2').value = '';
        const resDiv = document.getElementById('result');
        resDiv.innerText = 'Ответ';
        resDiv.classList.remove('danger');
    }

    function calculate() {
        const n1 = parseFloat(document.getElementById('num1').value);
        const n2 = parseFloat(document.getElementById('num2').value);
        const op = document.getElementById('op').value;
        const resDiv = document.getElementById('result');

        if (isNaN(n1) || isNaN(n2)) {
            resDiv.innerText = 'Введите числа';
            return;
        }

        let res;
        switch(op) {
            case '+': res = n1 + n2; break;
            case '-': res = n1 - n2; break;
            case '*': res = n1 * n2; break;
            case '/': res = n2 !== 0 ? n1 / n2 : 'Ошибка'; break;
        }

        resDiv.classList.remove('danger');
        
        if (typeof res === 'number') {
            if (res > 15) {
                resDiv.innerText = 'число>15';
                resDiv.classList.add('danger');
            } else {
                resDiv.innerText = res;
            }
        } else {
            resDiv.innerText = res;
        }
    }
</script>

</body>
</html>
